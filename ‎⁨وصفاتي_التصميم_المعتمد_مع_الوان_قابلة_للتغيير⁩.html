<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee7">
<title>وصفاتي</title>
<style>
:root{
  --bg:#f8efe8; --card:#fffaf7; --line:#eadbd2; --brown:#6f4639;
  --brown2:#8d6255; --text:#3e2b25; --muted:#9a8177; --soft:#f2e2d9;
  --pink:#e9c8bf; --shadow:0 8px 28px rgba(102,69,55,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 94px}
.header{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 14px}
.brand{display:flex;align-items:center;gap:8px}
.brand .chef{font-size:31px}
.brand h1{font-size:32px;margin:0;font-weight:900;letter-spacing:-1px}
.brandSub{font-size:13px;color:var(--muted);margin-top:1px}
.iconBtn{width:42px;height:42px;border:0;border-radius:14px;background:transparent;color:var(--brown);font-size:21px}
.searchWrap{position:relative;margin-bottom:13px}
.searchWrap span{position:absolute;right:15px;top:12px;font-size:18px;color:#8e756c}
.search{width:100%;height:48px;border:1px solid var(--line);background:#fffaf8;border-radius:25px;padding:0 45px 0 16px;outline:none;color:var(--text)}
.addMain{width:100%;height:50px;border:0;border-radius:17px;background:var(--brown);color:#fff;font-weight:800;font-size:17px;box-shadow:var(--shadow);margin-bottom:16px}
.addMain b{font-size:23px;vertical-align:-2px;margin-left:4px}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 9px}
.sectionHead h2{font-size:17px;margin:0;font-weight:900}
.sectionHead button{border:0;background:none;color:var(--muted);font-size:13px}
.catGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
.catTile{border:1px solid var(--line);background:rgba(255,250,247,.9);border-radius:17px;padding:9px 6px 8px;min-height:88px;color:var(--text);box-shadow:0 3px 12px rgba(90,60,48,.04)}
.catTile .emoji{font-size:31px;display:block;margin-bottom:4px}
.catTile span:last-child{font-size:13px;font-weight:700}
.catTile.active{background:var(--soft);border-color:#c99f91}
.recentGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.recipeMini{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 4px 16px rgba(90,60,48,.06);min-width:0}
.recipeMini .pic{height:105px;background:#eadbd2;position:relative;overflow:hidden}
.recipeMini img{width:100%;height:100%;object-fit:cover}
.recipeMini .heart{position:absolute;top:6px;left:6px;width:29px;height:29px;border:0;border-radius:50%;background:#fff9f6dd;color:#9a5f59}
.recipeMini .noPic{height:100%;display:flex;align-items:center;justify-content:center;font-size:35px}
.recipeMini .miniText{padding:8px 8px 10px}
.recipeMini h3{font-size:13px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipeMini p{font-size:11px;color:var(--muted);margin:0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:40px 18px;text-align:center;color:var(--muted);margin-top:14px}
.bottomNav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffaf8ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(12px,calc((100vw - 520px)/2)) 10px}
.navInner{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navItem{border:0;background:none;color:#866e65;font-size:11px;padding:4px 0}
.navItem .ni{display:block;font-size:20px;margin-bottom:2px}
.navItem.active{color:var(--brown);font-weight:800}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(40,25,20,.48);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:#fffaf7;border-radius:28px 28px 0 0;max-height:94vh;overflow:auto;padding:17px 17px 28px;box-shadow:0 -12px 35px rgba(40,25,20,.18)}
.sheetTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheetTop h2{font-size:21px;margin:0}
.x{width:36px;height:36px;border:0;border-radius:50%;background:#f0e5df;color:var(--brown);font-size:22px}
.methodGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.method{border:1px solid var(--line);background:#fff;border-radius:17px;padding:16px 8px;text-align:center;color:var(--text)}
.method .mi{font-size:30px;display:block;margin-bottom:5px}
.method b{font-size:13px}
.preview{width:100%;max-height:270px;object-fit:contain;background:#f3e8e1;border-radius:18px;margin:7px 0 10px;display:none}
.progress{display:none;background:#f2e3db;border-radius:13px;padding:10px;color:#79584e;font-size:13px;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:900;margin:11px 1px 5px}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none;color:var(--text)}
textarea.field{resize:vertical;min-height:100px;line-height:1.8}
.catSelect{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.catPick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:12px;color:#73564d}
.catPick.selected{background:var(--soft);border-color:#bd8f82;font-weight:800}
.saveBtn{width:100%;border:0;background:var(--brown);color:#fff;border-radius:16px;height:49px;margin-top:14px;font-weight:900}
.small{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}

/* viewer */
.viewer{position:fixed;inset:0;background:var(--bg);display:none;z-index:60;overflow:auto}
.viewerInner{max-width:520px;margin:auto;min-height:100vh;padding-bottom:35px}
.viewerHead{position:sticky;top:0;z-index:3;height:54px;background:#f8efe8e8;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #eadbd266}
.back{border:0;background:none;font-size:26px;color:var(--brown)}
.viewerActions{display:flex;gap:5px}
.viewerActions button{border:0;background:#fff8f5;border-radius:11px;width:38px;height:38px;color:var(--brown)}
.hero{background:#eee1d9;min-height:220px;max-height:420px;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;max-height:420px;object-fit:cover}
.hero.no{font-size:70px}
.viewerBody{padding:17px}
.viewerTitle{font-size:27px;font-weight:900;margin:0 0 7px}
.badge{display:inline-block;background:var(--soft);border:1px solid #e3c9bd;color:#725046;padding:6px 10px;border-radius:999px;font-size:12px}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:11px;color:#806b62}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0 10px}
.tab{border:0;background:#f0e1d9;border-radius:11px;padding:10px 4px;color:#76554b;font-size:12px;font-weight:800}
.tab.active{background:var(--brown);color:#fff}
.vSection{display:none}
.vSection.active{display:block}
.recipeText{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;white-space:pre-wrap;line-height:1.95;font-size:15px}
.viewerBottom{position:sticky;bottom:10px;margin-top:16px;display:flex;gap:8px}
.viewerBottom button{flex:1;border:0;border-radius:15px;height:48px;font-weight:800}
.editBtn{background:var(--brown);color:#fff}
.photoBtn{background:#efe1d9;color:#684a40}

/* lists */
.listPage{display:none}
.listItem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:8px;margin:8px 0}
.listThumb{width:66px;height:66px;border-radius:13px;object-fit:cover;background:#eadbd2;flex:none}
.listInfo{min-width:0;flex:1}
.listInfo h3{margin:0 0 3px;font-size:14px}
.listInfo p{margin:0;color:var(--muted);font-size:11px}
.listHeart{border:0;background:none;color:#ad645d;font-size:20px}

/* hide file inputs */
.fileInput{display:none}
@media(min-width:521px){.bottomNav{left:50%;right:auto;width:520px;transform:translateX(-50%)}}

.theme-rose{--bg:#f8eeee;--card:#fffafa;--line:#ead6d9;--brown:#8b5f67;--brown2:#a87982;--soft:#f2dfe3}
.theme-sage{--bg:#f1f5ef;--card:#fbfdf9;--line:#d7e1d2;--brown:#5d735f;--brown2:#7d947e;--soft:#e2ecdf}
.theme-lavender{--bg:#f4f0f8;--card:#fcfaff;--line:#ddd3e7;--brown:#716080;--brown2:#8d789d;--soft:#e9e0f0}
.theme-sky{--bg:#eef6f8;--card:#fbfeff;--line:#d3e4e8;--brown:#4f7480;--brown2:#70919b;--soft:#dcecef}
.theme-peach{--bg:#fbf0e8;--card:#fffaf6;--line:#ecd8c9;--brown:#9a684e;--brown2:#b78367;--soft:#f3dfd1}
.colorPanel{position:fixed;inset:0;background:rgba(40,25,20,.42);display:none;align-items:flex-end;justify-content:center;z-index:100}
.colorSheet{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:18px 17px 30px;box-shadow:0 -12px 35px rgba(40,25,20,.18)}
.colorGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.colorChoice{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:11px 6px;color:var(--text)}
.swatch{width:42px;height:42px;border-radius:50%;margin:0 auto 7px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.colorChoice.active{outline:2px solid var(--brown)}

</style>
</head>
<body>

<div class="app" id="homePage">
  <header class="header">
    <button class="iconBtn" onclick="openColors()">⚙️</button>
    <div class="brand">
      <div>
        <h1><span class="chef">👩🏻‍🍳</span> وصفاتي</h1>
        <div class="brandSub">كل وصفاتك في مكان واحد 🤎</div>
      </div>
    </div>
    <button class="iconBtn" onclick="showFavorites()">♡</button>
  </header>

  <div class="searchWrap"><span>⌕</span><input id="search" class="search" placeholder="ابحث عن وصفة ..." oninput="renderHome()"></div>
  <button class="addMain" onclick="openEditor()">＋ إضافة وصفة</button>

  <div class="sectionHead"><h2>الأقسام</h2><button onclick="clearCategory()">عرض الكل</button></div>
  <div class="catGrid" id="homeCats"></div>

  <div class="sectionHead"><h2>آخر الوصفات المضافة</h2><button onclick="showAll()">عرض الكل</button></div>
  <div id="recent" class="recentGrid"></div>
  <div id="homeEmpty" class="empty" style="display:none">أضيفي أول وصفة لك 🤎</div>
</div>

<div class="listPage" id="listPage">
  <div class="app">
    <div class="header"><button class="iconBtn" onclick="goHome()">‹</button><div class="brand"><div><h1 id="listTitle">وصفاتي</h1></div></div><div style="width:42px"></div></div>
    <div class="searchWrap"><span>⌕</span><input id="listSearch" class="search" placeholder="ابحث عن وصفة ..." oninput="renderListPage()"></div>
    <div id="listResults"></div>
  </div>
</div>

<div class="bottomNav">
  <div class="navInner">
    <button class="navItem active" id="navHome" onclick="goHome()"><span class="ni">⌂</span>الرئيسية</button>
    <button class="navItem" onclick="showFavorites()"><span class="ni">♡</span>المفضلة</button>
    <button class="navItem" onclick="showCategories()"><span class="ni">▦</span>الأقسام</button>
    <button class="navItem" onclick="showAll()"><span class="ni">◉</span>وصفاتي</button>
  </div>
</div>

<!-- editor -->
<div class="overlay" id="editorOverlay">
 <div class="sheet">
  <div class="sheetTop"><button class="x" onclick="closeEditor()">×</button><h2 id="editorTitle">إضافة وصفة</h2><div style="width:36px"></div></div>
  <div class="methodGrid">
    <button class="method" onclick="document.getElementById('photoInput').click()"><span class="mi">🖼️</span><b>اختيار صورة من المعرض</b></button>
    <button class="method" onclick="document.getElementById('cameraInput').click()"><span class="mi">📷</span><b>تصوير الوصفة الآن</b></button>
  </div>
  <input class="fileInput" id="photoInput" type="file" accept="image/*" onchange="handlePhoto(this)">
  <input class="fileInput" id="cameraInput" type="file" accept="image/*" capture="environment" onchange="handlePhoto(this)">
  <img id="editorPreview" class="preview">
  <div id="ocrProgress" class="progress"></div>
  <div id="ocrNote" class="small"></div>

  <label>اسم الوصفة</label><input id="name" class="field" placeholder="مثلاً: كيكة الشوكولاتة">
  <label>التصنيف</label><div id="categoryChoices" class="catSelect"></div>
  <label>المكونات</label><textarea id="ingredients" class="field" placeholder="المكونات..."></textarea>
  <label>طريقة التحضير</label><textarea id="steps" class="field" placeholder="طريقة التحضير..."></textarea>
  <label>ملاحظات</label><textarea id="notes" class="field" placeholder="ملاحظاتك الخاصة..."></textarea>
  <button class="saveBtn" onclick="saveRecipe()">حفظ الوصفة</button>
  <div class="small">بعد اختيار الصورة تتم محاولة قراءة النص من الصورة كاملة تلقائيًا. راجعي النص قبل الحفظ لأن OCR قد يخطئ أحيانًا.</div>
 </div>
</div>

<!-- viewer -->
<div class="viewer" id="viewer">
 <div class="viewerInner">
  <div class="viewerHead">
    <button class="back" onclick="closeViewer()">‹</button>
    <div class="viewerActions">
      <button onclick="toggleCurrentFavorite()" id="viewFav">♡</button>
      <button onclick="editCurrent()">✏️</button>
      <button onclick="deleteCurrent()">🗑️</button>
    </div>
  </div>
  <div id="hero" class="hero no">🍽️</div>
  <div class="viewerBody">
    <h1 id="viewTitle" class="viewerTitle"></h1>
    <span id="viewBadge" class="badge"></span>
    <div class="stats" id="viewStats"></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('ingredients',this)">المكونات</button>
      <button class="tab" onclick="switchTab('steps',this)">الطريقة</button>
      <button class="tab" onclick="switchTab('notes',this)">ملاحظاتي</button>
    </div>
    <div id="vIngredients" class="vSection active"><div id="viewIngredients" class="recipeText"></div></div>
    <div id="vSteps" class="vSection"><div id="viewSteps" class="recipeText"></div></div>
    <div id="vNotes" class="vSection"><div id="viewNotes" class="recipeText"></div></div>
    <div class="viewerBottom">
      <button class="photoBtn" onclick="changeCurrentPhoto()">🖼️ تغيير الصورة</button>
      <button class="editBtn" onclick="editCurrent()">✏️ تعديل الوصفة</button>
    </div>
  </div>
 </div>
</div>
<input class="fileInput" id="viewerPhotoInput" type="file" accept="image/*" onchange="saveCurrentPhoto(this)">


<div class="colorPanel" id="colorPanel">
  <div class="colorSheet">
    <div class="sheetTop">
      <button class="x" onclick="closeColors()">×</button>
      <h2>لون التصميم</h2>
      <div style="width:36px"></div>
    </div>
    <div class="small">اختاري اللون اللي يعجبك، وبيحفظ تلقائيًا 🤎</div>
    <div class="colorGrid" id="colorGrid"></div>
  </div>
</div>

<script>
const KEY="wasfati";
const cats=[
 {id:"حلوى",e:"🍰"}, {id:"أطباق رئيسية",e:"🍛"}, {id:"خبز",e:"🍞"},
 {id:"مشروبات",e:"🥤"}, {id:"مقبلات",e:"🥗"}, {id:"شوربات",e:"🍲"},
 {id:"فطور",e:"🍳"}, {id:"عشاء",e:"🍽️"}, {id:"غداء",e:"🥘"}, {id:"أخرى",e:"•••"}
];
let recipes=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId=null, selectedCategory="", selectedImage="", currentId=null, currentFilter="الكل", favoritesOnly=false;

function save(){localStorage.setItem(KEY,JSON.stringify(recipes))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function getCat(id){return cats.find(c=>c.id===id)||cats[cats.length-1]}
function ensureDates(){
 recipes.forEach((r,i)=>{if(!r.date)r.date=Date.now()-i*86400000});
 save();
}
function renderCats(){
 const el=document.getElementById("homeCats");
 el.innerHTML=cats.slice(0,9).map(c=>`<button class="catTile ${currentFilter===c.id?'active':''}" onclick="filterCat('${c.id}')"><span class="emoji">${c.e}</span><span>${c.id}</span></button>`).join("");
 document.getElementById("categoryChoices").innerHTML=cats.map(c=>`<button type="button" class="catPick ${selectedCategory===c.id?'selected':''}" onclick="pickCat('${c.id}')">${c.e} ${c.id}</button>`).join("");
}
function renderHome(){
 renderCats();
 const q=(document.getElementById("search").value||"").trim().toLowerCase();
 let data=recipes.filter(r=>{
  const hay=(r.name+" "+r.ingredients+" "+r.steps).toLowerCase();
  return (!q||hay.includes(q)) && (currentFilter==="الكل"||r.category===currentFilter) && (!favoritesOnly||r.fav);
 }).sort((a,b)=>(b.date||0)-(a.date||0));
 const recent=data.slice(0,6);
 const el=document.getElementById("recent");
 el.className="recentGrid";
 el.innerHTML=recent.map(miniCard).join("");
 document.getElementById("homeEmpty").style.display=recent.length?"none":"block";
}
function miniCard(r){
 const c=getCat(r.category);
 return `<div class="recipeMini" onclick="openViewer('${r.id}')">
  <div class="pic">${r.image?`<img src="${r.image}" alt="">`:`<div class="noPic">${c.e}</div>`}
   <button class="heart" onclick="event.stopPropagation();toggleFav('${r.id}')">${r.fav?"♥":"♡"}</button>
  </div>
  <div class="miniText"><h3>${esc(r.name||"وصفة")}</h3><p>${esc(r.category||"أخرى")}</p></div>
 </div>`;
}
function filterCat(c){currentFilter=c;favoritesOnly=false;renderHome();showHomeNav()}
function clearCategory(){currentFilter="الكل";favoritesOnly=false;document.getElementById("search").value="";renderHome()}
function showAll(){currentFilter="الكل";favoritesOnly=false;showList("وصفاتي")}
function showFavorites(){favoritesOnly=true;currentFilter="الكل";showList("المفضلة")}
function showCategories(){currentFilter="الكل";favoritesOnly=false;showList("الأقسام")}
function showList(title){
 document.getElementById("homePage").style.display="none";
 document.getElementById("listPage").style.display="block";
 document.getElementById("listTitle").textContent=title;
 document.getElementById("listSearch").value="";
 renderListPage();
}
function renderListPage(){
 const q=(document.getElementById("listSearch").value||"").toLowerCase();
 let data=recipes.filter(r=>{
  const hay=(r.name+" "+r.ingredients+" "+r.steps).toLowerCase();
  return (!q||hay.includes(q))&&(currentFilter==="الكل"||r.category===currentFilter)&&(!favoritesOnly||r.fav);
 }).sort((a,b)=>(b.date||0)-(a.date||0));
 if(document.getElementById("listTitle").textContent==="الأقسام"){
  document.getElementById("listResults").innerHTML=`<div class="catGrid">${cats.map(c=>`<button class="catTile" onclick="filterCatFromList('${c.id}')"><span class="emoji">${c.e}</span><span>${c.id}</span></button>`).join("")}</div>`;
  return;
 }
 document.getElementById("listResults").innerHTML=data.length?data.map(listCard).join(""):`<div class="empty">ما فيه وصفات هنا 🤎</div>`;
}
function filterCatFromList(c){currentFilter=c;favoritesOnly=false;showList(c)}
function listCard(r){
 const c=getCat(r.category);
 return `<div class="listItem" onclick="openViewer('${r.id}')">
  ${r.image?`<img class="listThumb" src="${r.image}">`:`<div class="listThumb" style="display:flex;align-items:center;justify-content:center;font-size:28px">${c.e}</div>`}
  <div class="listInfo"><h3>${esc(r.name||"وصفة")}</h3><p>${esc(r.category||"أخرى")}</p></div>
  <button class="listHeart" onclick="event.stopPropagation();toggleFav('${r.id}');renderListPage()">${r.fav?"♥":"♡"}</button>
 </div>`;
}
function goHome(){
 document.getElementById("listPage").style.display="none";
 document.getElementById("homePage").style.display="block";
 showHomeNav();renderHome();
}
function showHomeNav(){
 document.querySelectorAll(".navItem").forEach(x=>x.classList.remove("active"));
 document.getElementById("navHome").classList.add("active");
}
function openEditor(id=null){
 editingId=id;
 document.getElementById("editorOverlay").style.display="flex";
 document.getElementById("editorTitle").textContent=id?"تعديل الوصفة":"إضافة وصفة";
 if(id){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  document.getElementById("name").value=r.name||"";
  document.getElementById("ingredients").value=r.ingredients||"";
  document.getElementById("steps").value=r.steps||"";
  document.getElementById("notes").value=r.notes||"";
  selectedCategory=r.category||"أخرى";selectedImage=r.image||"";
  if(selectedImage){document.getElementById("editorPreview").src=selectedImage;document.getElementById("editorPreview").style.display="block"}
 }else{
  ["name","ingredients","steps","notes"].forEach(id=>document.getElementById(id).value="");
  selectedCategory="";selectedImage="";
  document.getElementById("editorPreview").style.display="none";
  document.getElementById("photoInput").value="";
  document.getElementById("cameraInput").value="";
  document.getElementById("ocrNote").textContent="";
 }
 renderCats();
}
function closeEditor(){document.getElementById("editorOverlay").style.display="none";editingId=null}
function pickCat(c){selectedCategory=c;renderCats()}
function compressDataURL(file,maxSide=1400){
 return new Promise((resolve,reject)=>{
  const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);resolve(c.toDataURL("image/jpeg",.78))};
  img.onerror=reject;img.src=u;
 })
}
async function ocrSpace(file){
 const dataUrl=await compressDataURL(file,2000);
 const fd=new FormData();
 fd.append("base64Image",dataUrl);
 fd.append("language","ara");fd.append("OCREngine","3");fd.append("isOverlayRequired","false");fd.append("scale","true");fd.append("isTable","true");
 const res=await fetch("https://api.ocr.space/parse/image",{method:"POST",headers:{apikey:"helloworld"},body:fd});
 const data=await res.json();
 if(!res.ok||data.IsErroredOnProcessing)throw new Error((data.ErrorMessage||[]).join(" ")||"تعذر قراءة الصورة");
 return (data.ParsedResults||[]).map(x=>x.ParsedText||"").join("\n").trim();
}
function tidy(s){
 return String(s||"").split("\n").map(x=>x.replace(/[|¦]/g," ").replace(/\s+/g," ").trim()).filter(x=>x.length>1&&!/https?:\/\/|www\.|انستقرام|سناب|تيك\s*توك|يوتيوب|رابط ملف/i.test(x)).map(x=>x.replace(/^[•●▪◦\-–—]+\s*/,"")).join("\n");
}
function fillOCR(text){
 const lines=text.split("\n").map(x=>x.trim()).filter(Boolean);
 let name=(lines[0]||"وصفة من صورة").replace(/^(المكونات|المقادير|وصفة)\s*[:：]?\s*/i,"").trim();
 const im=text.match(/(?:المكونات|المقادير)\s*[:：]?\s*([\s\S]*?)(?=(?:طريقة التحضير|الطريقة|الخطوات|طريقة العمل)\s*[:：]?|$)/i);
 const sm=text.match(/(?:طريقة التحضير|الطريقة|الخطوات|طريقة العمل)\s*[:：]?\s*([\s\S]*)/i);
 document.getElementById("name").value=(name&&name.length<90?name:"وصفة من صورة");
 document.getElementById("ingredients").value=im?tidy(im[1]):tidy(lines.slice(1).join("\n"));
 document.getElementById("steps").value=sm?tidy(sm[1]):"";
}
async function handlePhoto(input){
 const file=input.files?.[0];if(!file)return;
 selectedImage=await compressDataURL(file);
 const prev=document.getElementById("editorPreview");prev.src=selectedImage;prev.style.display="block";
 const p=document.getElementById("ocrProgress");p.style.display="block";p.textContent="جاري قراءة الصورة كاملة… ⏳";
 try{const t=await ocrSpace(file);fillOCR(t);p.style.display="none";document.getElementById("ocrNote").textContent="تمت قراءة الصورة كاملة تلقائيًا 🤎 راجعي النص قبل الحفظ."}
 catch(e){p.textContent="تعذر قراءة النص الآن، لكن الصورة جاهزة للحفظ. يمكنك الكتابة يدويًا.";document.getElementById("ocrNote").textContent=""}
}
function saveRecipe(){
 const rdata={name:document.getElementById("name").value.trim(),category:selectedCategory||"أخرى",ingredients:document.getElementById("ingredients").value.trim(),steps:document.getElementById("steps").value.trim(),notes:document.getElementById("notes").value.trim(),image:selectedImage||"",date:Date.now()};
 if(!rdata.name){alert("اكتبي اسم الوصفة 🤎");return}
 if(editingId){
  const r=recipes.find(x=>x.id===editingId);Object.assign(r,rdata);
 }else{rdata.id=String(Date.now());rdata.fav=false;recipes.unshift(rdata)}
 save();closeEditor();renderHome();
}
function openViewer(id){
 const r=recipes.find(x=>x.id===id);if(!r)return;currentId=id;
 document.getElementById("viewer").style.display="block";document.body.style.overflow="hidden";
 document.getElementById("viewTitle").textContent=r.name||"وصفة";
 const c=getCat(r.category);document.getElementById("viewBadge").textContent=c.e+" "+(r.category||"أخرى");
 const hero=document.getElementById("hero");
 hero.innerHTML=r.image?`<img src="${r.image}" alt="">`:`<div class="hero no">${c.e}</div>`;
 document.getElementById("viewIngredients").textContent=r.ingredients||"لا توجد مكونات.";
 document.getElementById("viewSteps").textContent=r.steps||"لا توجد طريقة تحضير.";
 document.getElementById("viewNotes").textContent=r.notes||"لا توجد ملاحظات.";
 document.getElementById("viewFav").textContent=r.fav?"♥":"♡";
 document.getElementById("viewStats").innerHTML=`<span class="stat">🍽️ ${esc(r.category||"أخرى")}</span><span class="stat">📝 ${((r.ingredients||"").split("\n").filter(Boolean).length)} مكونات تقريبًا</span>`;
 switchTab("ingredients",document.querySelector(".tab"));
}
function closeViewer(){document.getElementById("viewer").style.display="none";document.body.style.overflow="";currentId=null}
function switchTab(name,btn){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));btn?.classList.add("active");
 document.querySelectorAll(".vSection").forEach(x=>x.classList.remove("active"));
 document.getElementById("v"+name.charAt(0).toUpperCase()+name.slice(1)).classList.add("active");
}
function editCurrent(){if(currentId){const id=currentId;closeViewer();openEditor(id)}}
function toggleFav(id){const r=recipes.find(x=>x.id===id);if(r){r.fav=!r.fav;save();renderHome()}}
function toggleCurrentFavorite(){if(!currentId)return;toggleFav(currentId);const r=recipes.find(x=>x.id===currentId);document.getElementById("viewFav").textContent=r?.fav?"♥":"♡"}
function deleteCurrent(){if(!currentId)return;if(confirm("حذف هذه الوصفة؟")){recipes=recipes.filter(x=>x.id!==currentId);save();closeViewer();renderHome()}}
function changeCurrentPhoto(){document.getElementById("viewerPhotoInput").click()}
async function saveCurrentPhoto(input){
 const file=input.files?.[0];if(!file||!currentId)return;
 const r=recipes.find(x=>x.id===currentId);if(!r)return;
 r.image=await compressDataURL(file);save();openViewer(currentId);renderHome();input.value="";
}

const themeOptions=[
 {id:"default",name:"بيج دافئ",cls:"",color:"#8d6a5c"},
 {id:"rose",name:"وردي",cls:"theme-rose",color:"#8b5f67"},
 {id:"sage",name:"زيتي هادئ",cls:"theme-sage",color:"#5d735f"},
 {id:"lavender",name:"لافندر",cls:"theme-lavender",color:"#716080"},
 {id:"sky",name:"سماوي",cls:"theme-sky",color:"#4f7480"},
 {id:"peach",name:"خوخي",cls:"theme-peach",color:"#9a684e"}
];
function applyTheme(id){
 const opt=themeOptions.find(x=>x.id===id)||themeOptions[0];
 document.body.classList.remove("theme-rose","theme-sage","theme-lavender","theme-sky","theme-peach");
 if(opt.cls)document.body.classList.add(opt.cls);
 localStorage.setItem("wasfatiTheme",opt.id);
 document.querySelectorAll(".colorChoice").forEach(x=>x.classList.toggle("active",x.dataset.theme===opt.id));
}
function renderColorChoices(){
 const el=document.getElementById("colorGrid");
 const current=localStorage.getItem("wasfatiTheme")||"default";
 el.innerHTML=themeOptions.map(o=>`
  <button class="colorChoice ${o.id===current?"active":""}" data-theme="${o.id}" onclick="applyTheme('${o.id}')">
   <div class="swatch" style="background:${o.color}"></div>${o.name}
  </button>`).join("");
}
function openColors(){renderColorChoices();document.getElementById("colorPanel").style.display="flex"}
function closeColors(){document.getElementById("colorPanel").style.display="none"}
applyTheme(localStorage.getItem("wasfatiTheme")||"default");

ensureDates();renderCats();renderHome();
</script>
