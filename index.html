<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8d6257">
<title>وصفاتي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f1eb;color:#3f302b;font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 90px}
h1{font-size:32px;margin:8px 0 2px}.sub{color:#8d756d;margin-bottom:22px}
.search{background:white;border:1px solid #eaded7;border-radius:18px;padding:14px 16px;width:100%;font-size:16px;outline:none}
.actions{display:flex;gap:10px;margin:14px 0}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filterBtn{border:1px solid #eaded7;background:#fff;color:#6d5149;border-radius:999px;padding:10px 14px;white-space:nowrap;font-size:14px}.filterBtn.active{background:#8d6257;color:#fff;border-color:#8d6257}.categoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}.catBtn{border:1px solid #eaded7;background:#fff;color:#6d5149;border-radius:14px;padding:11px 7px;font-size:14px}.catBtn.selected{background:#f0e2db;border-color:#8d6257;color:#6b473d}.thumb{width:100%;height:180px;object-fit:cover;border-radius:16px;margin-bottom:10px}.tag{display:inline-block;background:#f0e4de;color:#75554c;border-radius:999px;padding:5px 9px;font-size:12px;margin:4px 0 8px}.detailModal{position:fixed;inset:0;background:#0007;display:none;align-items:end;justify-content:center;z-index:10}.detailSheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px;max-height:92vh;overflow:auto}.detailSheet img{width:100%;max-height:300px;object-fit:contain;border-radius:18px;margin:12px 0;background:#f5eee8}.sectionTitle{font-weight:800;font-size:18px;margin:16px 0 6px}.recipeText{white-space:pre-wrap;line-height:1.9;background:#faf6f2;border-radius:16px;padding:12px}.btn{border:0;border-radius:16px;padding:14px 16px;font-size:15px;cursor:pointer}.primary{background:#8d6257;color:#fff;flex:1}.soft{background:#eee2db;color:#5e4740}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #6b4d3b12}.card h3{margin:0 0 8px}.meta{color:#907b73;font-size:13px}
textarea,input{width:100%;border:1px solid #eaded7;border-radius:14px;padding:12px;font-size:15px;margin:7px 0;background:#fff}
label{font-weight:700;display:block;margin-top:10px}
.empty{text-align:center;padding:50px 20px;color:#9a847b}
#photo{display:none}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px;max-height:90vh;overflow:auto}
.close{float:left;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eaded7;padding:10px;text-align:center}
.nav button{border:0;background:none;font-size:14px;color:#70554d}
#preview{display:none;width:100%;max-height:220px;object-fit:contain;border-radius:16px;margin:12px 0;background:#f5eee8}
.progress{display:none;background:#f2e7df;border-radius:12px;padding:10px;margin:10px 0;color:#6f5148;font-size:14px}
.small{font-size:12px;color:#9a847b;line-height:1.6}
</style>

</head>
<body>
<div class="app">
  <h1>وصفاتي</h1><div class="sub">كل وصفاتك في مكان واحد 🤎</div>
  <input id="search" class="search" placeholder="ابحثي عن وصفة أو مكوّن..." oninput="render()">
  <div class="actions">
    <button class="btn primary" onclick="openEditor()">＋ إضافة وصفة</button>
    <button class="btn soft" onclick="renderFavorites()">♡ المفضلة</button>
  </div>
  <div class="filters" id="filters">
    <button class="filterBtn active" data-filter="الكل" onclick="setFilter('الكل')">الكل</button>
    <button class="filterBtn" data-filter="حلوى" onclick="setFilter('حلوى')">🍰 حلوى</button>
    <button class="filterBtn" data-filter="عصير" onclick="setFilter('عصير')">🥤 عصير</button>
    <button class="filterBtn" data-filter="فطور" onclick="setFilter('فطور')">🍳 فطور</button>
    <button class="filterBtn" data-filter="غداء" onclick="setFilter('غداء')">🍛 غداء</button>
    <button class="filterBtn" data-filter="عشاء" onclick="setFilter('عشاء')">🍽️ عشاء</button>
    <button class="filterBtn" data-filter="أخرى" onclick="setFilter('أخرى')">✨ أخرى</button>
  </div>
  <div id="list"></div>
</div>
<div class="nav">وصفاتي &nbsp; • &nbsp; مفضلة &nbsp; • &nbsp; إضافة وصفة</div>

<div id="modal" class="modal">
 <div class="sheet">
  <button class="close" onclick="closeEditor()">×</button>
  <h2>إضافة وصفة</h2>
  <button class="btn soft" onclick="document.getElementById('photo').click()">🖼️ اختاري صورة من الصور</button>
  <input id="photo" type="file" accept="image/*" onchange="readPhoto(this)">
  <img id="preview" alt="صورة الوصفة">
  <div id="progress" class="progress"></div>
<div id="photoNote" class="meta"></div>
  <label>اسم الوصفة</label><input id="name" placeholder="مثلاً: كيكة الشوكولاتة">
  <label>نوع الوصفة</label><div class="categoryGrid" id="categoryGrid">
   <button type="button" class="catBtn" data-cat="حلوى" onclick="selectCategory(this)">🍰 حلوى</button>
   <button type="button" class="catBtn" data-cat="عصير" onclick="selectCategory(this)">🥤 عصير</button>
   <button type="button" class="catBtn" data-cat="فطور" onclick="selectCategory(this)">🍳 فطور</button>
   <button type="button" class="catBtn" data-cat="عشاء" onclick="selectCategory(this)">🍽️ عشاء</button>
   <button type="button" class="catBtn" data-cat="غداء" onclick="selectCategory(this)">🍛 غداء</button>
   <button type="button" class="catBtn" data-cat="أخرى" onclick="selectCategory(this)">✨ أخرى</button>
  </div>
  <label>المكونات</label><textarea id="ingredients" rows="6" placeholder="اكتبي المكونات هنا..."></textarea>
  <label>طريقة التحضير</label><textarea id="steps" rows="7" placeholder="اكتبي طريقة التحضير هنا..."></textarea>
  <label>ملاحظات</label><textarea id="notes" rows="4" placeholder="ملاحظاتك الخاصة..."></textarea>
  <button class="btn primary" onclick="saveRecipe()">حفظ الوصفة</button>
  <div class="small">عند اختيار الصورة، يقرأ التطبيق النص من الصورة كاملة تلقائيًا بدون قص أو تحديد. تتم قراءة الصورة كاملة تلقائيًا، بدون قص أو تحديد.</div>
 </div>
</div>

<div id="detailModal" class="detailModal">
 <div class="detailSheet">
  <button class="close" onclick="closeDetail()">×</button>
  <h2 id="detailTitle"></h2>
  <span id="detailCategory" class="tag"></span>
  <img id="detailImage" alt="صورة الوصفة">
  <div class="sectionTitle">المكونات</div><div id="detailIngredients" class="recipeText"></div>
  <div class="sectionTitle">طريقة التحضير</div><div id="detailSteps" class="recipeText"></div>
  <div class="sectionTitle">ملاحظات</div><div id="detailNotes" class="recipeText"></div>
 </div>
</div>

<script>
let recipes=JSON.parse(localStorage.getItem("wasfati")||"[]"), favoritesOnly=false, paddle=null, paddleBusy=false, selectedCategory="", currentFilter="الكل";
function save(){localStorage.setItem("wasfati",JSON.stringify(recipes))}
function setFilter(cat){
  currentFilter=cat;
  favoritesOnly=false;
  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.toggle("active",b.dataset.filter===cat));
  render();
}
function filteredRecipes(){
  const q=(document.getElementById("search").value||"").trim().toLowerCase();
  return recipes.filter(r=>{
    const matchesQ=!q || ((r.name||"")+" "+(r.ingredients||"")+" "+(r.steps||"")).toLowerCase().includes(q);
    const matchesCat=currentFilter==="الكل" || (r.category||"أخرى")===currentFilter;
    const matchesFav=!favoritesOnly || !!r.fav;
    return matchesQ && matchesCat && matchesFav;
  });
}
function render(){
  const data=filteredRecipes();
  const el=document.getElementById("list");
  el.innerHTML=data.length?data.map(r=>card(r)).join(""):`<div class="empty">${recipes.length?"ما لقيت وصفة بهذا التصنيف أو البحث":"ابدئي بإضافة أول وصفة لك ✨"}</div>`;
}
function renderFavorites(){
  favoritesOnly=true;
  currentFilter="الكل";
  document.getElementById("search").value="";
  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.toggle("active",b.dataset.filter==="الكل"));
  const data=filteredRecipes();
  document.getElementById("list").innerHTML=data.map(card).join("")||'<div class="empty">ما عندك وصفات مفضلة بعد 🤎</div>';
}
function card(r){
 return `<div class="card">${r.image?`<img class="thumb" src="${r.image}" alt="صورة الوصفة">`:``}
 <h3>${esc(r.name||"وصفة بدون اسم")} ${r.fav?"♥":""}</h3>
 ${r.category?`<span class="tag">${esc(r.category)}</span>`:``}
 <div class="meta">${new Date(r.date).toLocaleDateString("ar-SA")}</div>
 <p>${esc((r.ingredients||"").slice(0,130))}</p>
 <button class="btn primary" onclick="viewRecipe('${r.id}')">👀 مشاهدة الوصفة</button>
 <button class="btn soft" onclick="shareRecipe('${r.id}')">↗️ مشاركة</button>
 <button class="btn soft" onclick="toggleFav('${r.id}')">${r.fav?"إزالة من المفضلة":"♡ مفضلة"}</button>
 <button class="btn soft" onclick="delRecipe('${r.id}')">حذف</button></div>`
}
function openEditor(){
 selectedCategory="";
 document.querySelectorAll(".catBtn").forEach(b=>b.classList.remove("selected"));
 document.getElementById("modal").style.display="flex";
 ["name","ingredients","steps","notes"].forEach(x=>document.getElementById(x).value="");
 document.getElementById("photoNote").textContent="";
 document.getElementById("progress").style.display="none";
 document.getElementById("preview").style.display="none";
 document.getElementById("photo").value="";
}
function closeEditor(){document.getElementById("modal").style.display="none"}
function selectCategory(btn){selectedCategory=btn.dataset.cat;document.querySelectorAll(".catBtn").forEach(b=>b.classList.toggle("selected",b===btn))}
async function compressImage(file){
 const url=URL.createObjectURL(file);
 try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
 const max=1200, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.78)}finally{URL.revokeObjectURL(url)}}
function viewRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;document.getElementById("detailTitle").textContent=r.name||"وصفة";document.getElementById("detailCategory").textContent=r.category||"";document.getElementById("detailCategory").style.display=r.category?"inline-block":"none";document.getElementById("detailImage").src=r.image||"";document.getElementById("detailImage").style.display=r.image?"block":"none";document.getElementById("detailIngredients").textContent=r.ingredients||"";document.getElementById("detailSteps").textContent=r.steps||"";document.getElementById("detailNotes").textContent=r.notes||"";document.getElementById("detailModal").style.display="flex"}
function closeDetail(){document.getElementById("detailModal").style.display="none"}

function cleanOCRLine(s){
 return String(s||"").replace(/[|¦]/g," ").replace(/[©®™]/g,"").replace(/\s+/g," ").trim();
}
function isNoiseLine(s){
 const x=s.toLowerCase();
 return !x || /https?:\/\//i.test(x) || /www\./i.test(x) || /رابط\s+ملف/i.test(x) || /تابعونا|انستقرام|تيك\s*توك|سناب|يوتيوب/i.test(x) || x.length<2;
}
function tidyLines(s){
 return String(s||"").split("\n").map(cleanOCRLine).filter(x=>!isNoiseLine(x)).map(x=>x.replace(/^[•●▪◦\-–—]+\s*/,"")).join("\n");
}
function guessRecipeName(lines){
 const first=cleanOCRLine(lines[0]||"");
 let n=first.replace(/^(?:مكونات|المكونات|المقادير|المقادير المطلوبة)\s*/i,"").replace(/^(?:وصفة|وصفه)\s*[:：]?\s*/i,"").replace(/\s*[:：]\s*$/," ").trim();
 if(!n || n.length>80 || /^(?:المكونات|المقادير|طريقة|الطريقة|الخطوات)$/i.test(n)) n="وصفة من صورة";
 return n;
}
function fillFromOCR(text){
 const lines=String(text||"").split("\n").map(cleanOCRLine).filter(Boolean).filter(x=>!isNoiseLine(x));
 let ingredients="",steps="",name=guessRecipeName(lines);
 const ingMatch=text.match(/(?:المكونات|المقادير|المقادير المطلوبة)\s*[:：]?\s*([\s\S]*?)(?=(?:طريقة التحضير|الطريقة|الخطوات|طريقة العمل)\s*[:：]?|$)/i);
 const stepMatch=text.match(/(?:طريقة التحضير|الطريقة|الخطوات|طريقة العمل)\s*[:：]?\s*([\s\S]*)/i);
 if(ingMatch) ingredients=tidyLines(ingMatch[1]);
 if(stepMatch) steps=tidyLines(stepMatch[1]);
 if(!ingredients && !steps) ingredients=tidyLines(lines.slice(1).join("\n"));
 if(/^وصفة من صورة$/.test(name)){
   const candidate=lines.find(x=>/كوكيز|كيك|كيكة|حلى|خبز|معجنات|بسكويت|تشيز|شوربة|كبسة|مكرونة|دجاج|لحم|سلطة|حلو|بان كيك|براونيز/i.test(x));
   if(candidate) name=candidate.replace(/^مكونات\s*/i,"").replace(/[:：]$/," ").trim();
 }
 document.getElementById("name").value=name.slice(0,100);
 document.getElementById("ingredients").value=ingredients;
 document.getElementById("steps").value=steps;
}

async function preprocessForOCR(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
    const maxSide=2200;
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*scale));
    const h=Math.max(1,Math.round(img.naturalHeight*scale));
    const c=document.createElement('canvas'); c.width=w;c.height=h;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0,w,h);
    // Gentle contrast/brightness normalization without destroying Arabic glyphs.
    const d=ctx.getImageData(0,0,w,h), a=d.data;
    for(let i=0;i<a.length;i+=4){
      const y=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
      const v=Math.max(0,Math.min(255,(y-128)*1.18+128));
      a[i]=a[i+1]=a[i+2]=v;
    }
    ctx.putImageData(d,0,0);
    return await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('تعذر تجهيز الصورة')),'image/jpeg',0.82));
  }finally{URL.revokeObjectURL(url)}
}

async function ocrSpace(file){
  const blob=await preprocessForOCR(file);
  const base64=await new Promise((resolve,reject)=>{
    const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(blob);
  });
  const fd=new FormData();
  fd.append('base64Image',base64);
  fd.append('language','ara');
  fd.append('OCREngine','3');
  fd.append('isOverlayRequired','false');
  fd.append('scale','true');
  fd.append('isTable','true');
  const res=await fetch('https://api.ocr.space/parse/image',{method:'POST',headers:{apikey:'helloworld'},body:fd});
  if(!res.ok) throw new Error('OCR API '+res.status);
  const data=await res.json();
  if(data.IsErroredOnProcessing){
    const msg=(data.ErrorMessage||[]).join(' ');
    throw new Error(msg||'فشل قارئ النص');
  }
  return (data.ParsedResults||[]).map(x=>x.ParsedText||'').join('\n').trim();
}

async function readPhoto(input){
 const file=input.files && input.files[0];
 if(!file || paddleBusy)return;
 const preview=document.getElementById('preview');
 preview.src=URL.createObjectURL(file); preview.style.display='block';
 const progress=document.getElementById('progress'), note=document.getElementById('photoNote');
 progress.style.display='block';progress.textContent='جاري تحسين الصورة وقراءة الوصفة كاملة… ⏳';note.textContent='';
 paddleBusy=true;
 try{
   const text=await ocrSpace(file);
   if(!text) throw new Error('لم يتم العثور على نص');
   fillFromOCR(text);
   progress.style.display='none';
   note.textContent='تمت قراءة الصورة كاملة تلقائيًا 🤎 راجعي النص قبل الحفظ.';
 }catch(e){
   console.error('OCR error:',e);
   progress.textContent='تعذر قراءة الصورة الآن. جربي صورة واضحة وبإضاءة جيدة.';
   note.textContent='';
 }finally{paddleBusy=false}
}

async function saveRecipe(){
 let image="";const file=document.getElementById("photo").files&&document.getElementById("photo").files[0];
 if(file){try{image=await compressImage(file)}catch(e){image=""}}
 let r={id:Date.now().toString(),name:document.getElementById("name").value||"وصفة جديدة",category:selectedCategory,ingredients:document.getElementById("ingredients").value,steps:document.getElementById("steps").value,notes:document.getElementById("notes").value,image,date:Date.now(),fav:false};
 recipes.unshift(r);save();closeEditor();render()
}
async function shareRecipe(id){
 let r=recipes.find(x=>x.id===id);
 let text=`🍽️ ${r.name}\n\nالمكونات:\n${r.ingredients}\n\nطريقة التحضير:\n${r.steps}${r.notes?"\n\nملاحظات:\n"+r.notes:""}`;
 if(navigator.share) await navigator.share({title:r.name,text}); else{await navigator.clipboard.writeText(text);alert("تم نسخ الوصفة للمشاركة 🤎")}
}
function toggleFav(id){let r=recipes.find(x=>x.id===id);r.fav=!r.fav;save();favoritesOnly?renderFavorites():render()}
function delRecipe(id){if(confirm("حذف الوصفة؟")){recipes=recipes.filter(x=>x.id!==id);save();render()}}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body></html>
